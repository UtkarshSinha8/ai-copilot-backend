version: '3.9'

services:
  backend:
    build: .
    container_name: ai_copilot_backend

    ports:
      - '3000:3000'

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    restart: always

    networks:
      - ai_copilot_network

  postgres:
    image: pgvector/pgvector:pg16

    container_name: ai_copilot_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_copilot

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

    networks:
      - ai_copilot_network

  redis:
    image: redis:7-alpine

    container_name: ai_copilot_redis

    ports:
      - '6379:6379'

    restart: always

    networks:
      - ai_copilot_network

volumes:
  postgres_data:

networks:
  ai_copilot_network: